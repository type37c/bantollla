[package]
name = "banto-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "banto CLI — 番頭: 台帳への1ジェスチャー記録と、開いたループを閉じさせる導出ビュー"
publish = false

[[bin]]
name = "banto"
path = "src/main.rs"

[dependencies]
banto-kernel = { path = "../banto-kernel" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
